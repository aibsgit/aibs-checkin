<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIBS Check In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
h1{color:#1a5276;font-size:20px;margin-bottom:4px}
.site{color:#888;font-size:14px;margin-bottom:24px}
label{display:block;text-align:left;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
input[type=text]{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:16px;-webkit-appearance:none}
input:focus{border-color:#1a5276;outline:none}
.btns{display:flex;gap:12px;margin-bottom:16px}
.btn{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;color:#fff}
.btn-in{background:#27ae60}
.btn-out{background:#e74c3c}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.5}
.status{font-size:14px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;padding:8px}
.status.ok{background:#d5f5e3;color:#1e8449}
.status.err{background:#fadbd8;color:#c0392b}
.status.wait{background:#fef9e7;color:#7d6608}
.gps{font-size:11px;color:#bbb;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>AIBS Employee Check In</h1>
  <div class="site" id="siteName"></div>
  <label for="empName">Your name</label>
  <input type="text" id="empName" placeholder="Enter your full name" autocomplete="name">
  <div class="btns">
    <button class="btn btn-in" id="btnIn" onclick="doSubmit('Check In')">CHECK IN</button>
    <button class="btn btn-out" id="btnOut" onclick="doSubmit('Check Out')">CHECK OUT</button>
  </div>
  <div class="status" id="status"></div>
  <div class="gps" id="gpsInfo"></div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbwgj7GUllMGsUZRN8dIQ-3PWlWGR_T39ZT6unnr82tYDrbvfWPuNFl2c7Rb26EnMBHpaA/exec';
var params=new URLSearchParams(window.location.search);
var site=params.get('site')||'Wagga Lab';
document.getElementById('siteName').textContent=site;
var lat='',lng='';
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(p){
    lat=p.coords.latitude.toFixed(6);
    lng=p.coords.longitude.toFixed(6);
    document.getElementById('gpsInfo').textContent='GPS: '+lat+', '+lng;
  },function(){
    document.getElementById('gpsInfo').textContent='GPS not available';
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function doSubmit(checkType){
  var name=document.getElementById('empName').value.trim();
  if(!name){show('Please enter your name','err');document.getElementById('empName').focus();return;}
  document.getElementById('btnIn').disabled=true;
  document.getElementById('btnOut').disabled=true;
  show('Submitting...','wait');
  var url=API+'?name='+encodeURIComponent(name)+'&checkType='+encodeURIComponent(checkType)+'&site='+encodeURIComponent(site)+'&lat='+lat+'&lng='+lng+'&t='+Date.now();
  var img=new Image();
  img.onload=img.onerror=function(){
    show(checkType==='Check In'?'Checked IN \u2714':'Checked OUT \u2714','ok');
    setTimeout(function(){document.getElementById('btnIn').disabled=false;document.getElementById('btnOut').disabled=false;},3000);
  };
  img.src=url;
}
function show(m,c){var e=document.getElementById('status');e.textContent=m;e.className='status '+c;}
<\/script>
</body>
</html>
