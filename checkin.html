<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIBS Check In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:48px 32px;text-align:center;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
h1{color:#1a5276;font-size:22px;margin-bottom:6px}
.site{color:#888;font-size:15px;margin-bottom:32px}
.spinner{width:44px;height:44px;border:4px solid #e8e8e8;border-top:4px solid #1a5276;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.status{color:#555;font-size:15px;line-height:1.6}
.status small{display:block;color:#aaa;font-size:12px;margin-top:4px}
.icon{font-size:36px;margin-bottom:12px}
.btn{display:inline-block;background:#1a5276;color:#fff;padding:14px 36px;border-radius:10px;text-decoration:none;font-size:16px;font-weight:500;margin-top:20px}
.note{font-size:11px;color:#bbb;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>AIBS Employee Check In</h1>
  <div class="site" id="siteName"></div>
  <div id="loading">
    <div class="spinner"></div>
    <p class="status">Getting your location...<small>This takes a moment on first use</small></p>
  </div>
  <div id="success" style="display:none">
    <div class="icon">📍</div>
    <p class="status">Location captured!</p>
    <p class="status"><small>Redirecting to check-in form...</small></p>
  </div>
  <div id="fallback" style="display:none">
    <div class="icon">📋</div>
    <p class="status">Tap below to open the check-in form</p>
    <a class="btn" id="fallbackLink" href="#">Open Check In \u2192</a>
    <p class="note">Location could not be detected \u2014 GPS may be disabled</p>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var site = params.get('site') || 'Wagga Lab';
document.getElementById('siteName').textContent = site;

var FORM_BASE = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Gm-vYa1oA0-LauzNTZ--ieCWJQiN4ghKgU0BCmDSD9NUOVFZQkxBTE1LM0k0NDFaR1dYUkhTMEUzOS4u';
var LAT_FIELD = 'rec4cd58947bd470a8503aadaecd151a2';
var LNG_FIELD = 'rdb827cb37ecb482fbe03f158f3eb6a78';

function goToForm(lat, lng) {
  var url = FORM_BASE;
  if (lat !== null && lng !== null) {
    url += '&' + LAT_FIELD + '=' + encodeURIComponent(lat.toFixed(6));
    url += '&' + LNG_FIELD + '=' + encodeURIComponent(lng.toFixed(6));
  }
  window.location.href = url;
}

function showFallback() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('fallbackLink').href = FORM_BASE;
}

var resolved = false;

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      if (resolved) return;
      resolved = true;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      setTimeout(function() {
        goToForm(pos.coords.latitude, pos.coords.longitude);
      }, 800);
    },
    function() {
      if (resolved) return;
      resolved = true;
      showFallback();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
  setTimeout(function() {
    if (!resolved) { resolved = true; showFallback(); }
  }, 12000);
} else {
  showFallback();
}
</script>
</body>
</html>
